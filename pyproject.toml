[project]
name = "stratum"
version = "0.1.0"
description = "Video to structured, provenance-tagged, agent-ready context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Mehdi" }]

# Base install must stay light. No torch, no provider SDKs, no ASR models.
# See CLAUDE.md: "Do not make the base install pull in PyTorch."
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "imagehash>=4.3",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
# Local ASR. Runs on CTranslate2, NOT PyTorch — keep it separable, because
# transcription should never cost you 2.5 GB of torch it does not use.
asr = ["faster-whisper>=1.0"]

# GPU acceleration for the CTranslate2 backends. Optional on top of `asr`:
# without it faster-whisper still runs, on CPU.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0",
]

# Local vision encoder. THIS is the extra that costs you gigabytes.
vision = [
    "open-clip-torch>=2.24",
    "torch>=2.2",
]

# Everything needed for the fully-local posture.
local = ["stratum[asr]", "stratum[vision]"]
# Cloud provider SDKs. Added one at a time as adapters are built (Phase 1-2).
cloud = []
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
stratum = "stratum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratum"]

# Prompts live at the repo root so they are easy to find and diff. They are also
# runtime data, so the wheel carries a copy inside the package.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "stratum/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # typer uses function calls in argument defaults by design
    "UP042", # `str, Enum` is the pydantic-idiomatic form and reads better than StrEnum here
    "N818",  # CostCapExceeded / SchemaViolation read better than ...Error suffixes
]

[tool.mypy]
# No `python_version` pin: the installed numpy stubs use 3.12-only syntax, and
# pinning 3.11 makes mypy fail parsing them before it reaches our code. Floor
# compatibility is enforced by running the test suite on 3.11, not by this.
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "imagehash.*", "scenedetect.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that decode video and take more than a second",
]
